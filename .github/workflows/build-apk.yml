# Tests and builds the launcher on every push and pull request. For a tag like v1.1.0 it also signs the APK with the
# project's release key (repository secrets) and publishes it with its SHA-256 as a GitHub release. After a release,
# add its "tag sha256" line to launcher/RELEASES.txt: `firetv.py install-launcher --release` only installs a build
# listed there, with the checksum from the repository rather than from the release.
name: build-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job below can write, and it runs no project code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK platform 34 and build-tools 34.0.0
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Tests
        run: python3 -m venv tools/venv && tools/venv/bin/pip install -r tools/requirements.txt && tools/venv/bin/python -m unittest discover -s tests
      - name: Release key (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.FIRETV_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "FIRETV_KEYSTORE_B64 is not set: a release is never published with the debug key." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "FIRETV_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build
        working-directory: launcher
        env:
          FIRETV_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
          FIRETV_KEY_ALIAS: ${{ secrets.FIRETV_KEY_ALIAS }}
          FIRETV_KEY_PASSWORD: ${{ secrets.FIRETV_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the APK and write its checksum
        run: |
          rm -f "$RUNNER_TEMP/release.p12"
          cp launcher/app/build/outputs/apk/release/app-release.apk cleanyourtv-firetv-launcher.apk
          sha256sum cleanyourtv-firetv-launcher.apk > cleanyourtv-firetv-launcher.apk.sha256
          cat cleanyourtv-firetv-launcher.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-apk
          path: cleanyourtv-firetv-launcher.apk*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: launcher-apk }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cleanyourtv-firetv-launcher.apk cleanyourtv-firetv-launcher.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Launcher APK for Fire TV, signed with the project key. SHA-256: $(cut -d' ' -f1 cleanyourtv-firetv-launcher.apk.sha256)"
